services:
  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: Project API
      ENVIRONMENT: development
      API_V1_PREFIX: /api/v1
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend
